<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>NFT preview card component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">     
        <div class="card__images">          
          <img src="images/image-equilibrium.jpg" alt="Equilibrium" />
          <div class="card__images-layer">
            <img src="images/icon-view.svg" alt="view-icon">
          </div>
        </div>

        <div class="card__title">
          <h1>Equilibrium #3429</h1>
            <p id="info" class="card__description">Our Equilibrium collection promotes balance and calm.</p>
          <div class="card__time">
            <p class="card__time-left">
              <img src="images/icon-ethereum.svg" alt="ethereum" />             
              <span>0.041 ETH</span>
            </p>
            <p class="card__time-right">
              <img src="images/icon-clock.svg" alt="clock" /> 
              <span>3 days left</span>
            </p>
          </div>
          <hr />
          <div class="card__creator">
            <img class="creator-image" src="images/image-avatar.png" alt="man" />
            <p>
            <span>Creation of</span>
            <span class="creator-name">Jules Wyvern</span>
            </p>
          </div>
        </div>
    </main>
    <!-- Footer -->
    <footer class="attribution">
        Challenge by
        <a href="https://www.crio.do" target="_blank" rel="noopener noreferrer">
            Crio.do
        </a>.

        Coded by
        <a href="https://www.github.com/pravinatagrey" target="_blank" rel="noopener noreferrer">
            Praveen Atagrey
        </a>.

    </footer>
  </body>
</html>
